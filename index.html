<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Clonao analyzes your personal brand and tells you what to focus on next." />
    <title>Clonao — Personal Brand AI for LinkedIn</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b4dff'/%3E%3Cpath d='M42 18a15 15 0 1 0 0 28H28a11 11 0 1 1 0-22h14z' fill='white'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="hero-atmosphere">
      <nav class="navbar" aria-label="Primary navigation">
        <a class="brand" href="#top" aria-label="Clonao home">
          <img class="brand-mark" src="assets/clonao-logo.png" alt="" aria-hidden="true" />
          <span>Clonao</span>
        </a>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-menu" aria-label="Open menu"><span></span><span></span></button>
        <div class="nav-links" id="primary-menu">
          <a href="#product">Product</a>
          <a href="#how-it-works">How it works</a>
          <a href="#pricing">Pricing</a>
          <a href="#resources">Resources</a>
        </div>
      </nav>

      <section class="hero" id="top">
        <div class="hero-copy reveal">
          <h1>The #1 Personal Brand AI for LinkedIn.</h1>
          <p>Clonao analyzes your personal brand, identifies the gaps, builds the strategy and tells you exactly what to focus on next.</p>
        </div>

        <section class="waitlist reveal" aria-live="polite">
          <div class="sheen" aria-hidden="true"></div>
          <div class="waitlist-copy">
            <h2 id="waitlist-title">Get early access</h2>
            <p id="waitlist-message">Be the first to try Clonao when we launch.</p>
          </div>
          <form id="waitlist-form" class="waitlist-form">
            <label class="sr-only" for="email">Email address</label>
            <input id="email" name="email" type="email" placeholder="Email address" autocomplete="email" required />
            <button id="submit-button" type="submit">Join the waitlist</button>
          </form>
          <p id="form-status" class="form-status" role="status"></p>
        </section>

        <div class="demo-wrap reveal" id="product">
          <img src="assets/clonao-demo.png" alt="Clonao dashboard showing next best moves, strategy, analytics, and Brand Graph" />
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
